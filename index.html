  <style>
    /* Base mobile-friendly styles */
    html {
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background-color: #fdfcfb;
      /* Modern Mesh Gradient Background */
      background-image:
        radial-gradient(at 0% 0%, rgba(198, 132, 102, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(239, 223, 213, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(198, 132, 102, 0.08) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(239, 223, 213, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: #3d2b24;
      position: relative;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.03;
      /* Slightly subtler noise */
      z-index: 1000;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Mobile-safe reveal animations */
    @media (prefers-reduced-motion: no-preference) {
      .reveal {
        opacity: 0;
        transform: translate3d(0, 20px, 0);
        transition: opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
      }

      .reveal-heading {
        opacity: 0;
        transform: translate3d(0, 15px, 0);
        transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s,
          transform 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.1s;
        will-change: opacity, transform;
      }

      .reveal-image {
        opacity: 0;
        transform: scale(1.01) translate3d(0, 15px, 0);
        transition: opacity 1s cubic-bezier(0.22, 1, 0.36, 1),
          transform 1s cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal, .reveal-heading, .reveal-image {
        opacity: 1;
        transform: none;
        transition: none;
      }
    }

    .revealed {
      opacity: 1 !important;
      transform: translate3d(0, 0, 0) scale(1) !important;
    }

    .glass {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    /* Mobile-specific utilities */
    @media (max-width: 768px) {
      .reveal, .reveal-heading, .reveal-image {
        transition-duration: 0.5s;
      }
    }

    /* Touch-friendly tap highlights */
    * {
      -webkit-tap-highlight-color: rgba(198, 132, 102, 0.2);
    }

    /* Smooth scrolling */
    html {
      scroll-behavior: smooth;
    }

    /* Prevent text selection on buttons for better mobile UX */
    button, a {
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const observerOptions = {
        root: null,
        rootMargin: '0px',
        threshold: 0.15
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
          }
        });
      }, observerOptions);

      // Function to observe elements
      const observeElements = (container = document) => {
        const elements = container.querySelectorAll('.reveal, .reveal-heading, .reveal-image');
        elements.forEach(el => observer.observe(el));
      };

      // Initial observation
      observeElements();

      // MutationObserver to catch dynamically added content (React)
      const mutationObserver = new MutationObserver((mutations) => {
        mutations.forEach(mutation => {
          mutation.addedNodes.forEach(node => {
            if (node.nodeType === 1) { // Element node
              if (node.matches('.reveal, .reveal-heading, .reveal-image')) {
                observer.observe(node);
              }
              observeElements(node);
            }
          });
        });
      });

      mutationObserver.observe(document.body, {
        childList: true,
        subtree: true
      });
    });
  </script>
